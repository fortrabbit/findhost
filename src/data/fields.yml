# How long the money keeps going out after you decide to leave, worst case, on
# the cheapest ordinary terms. A notice period and a minimum term are the same
# fact to a customer — time — so they are recorded as time and they add up.
- id: exitWithin
  label: Exit
  group: Pricing
  facet: exit
  subject: 'can be left {lower}'
  titleWith: 'you can leave {lower}'
  ordered: true
  filterOrder: 18
  values:
    - { id: a-day, label: Within a day }
    - { id: a-month, label: Within a month }
    - { id: a-quarter, label: Within a quarter }
    - { id: a-year, label: Within a year }
    - { id: over-a-year, label: Longer than a year }

# The refund window, which is a different question from `exitWithin` and reads
# like the same one. Exit is how long the money keeps going out once the decision
# to leave has been made; this is how long there is to change that mind and be
# given back what was already paid. A provider can answer one and not the other.
#
# Bands rather than the published number of days, because 14 and 15 are the same
# fact to a reader.
#
# Shown on a record and filtered only as a yes-or-no under `pricing`. What a
# refund window promises is the reversal of a payment, by a process the provider
# owns and seldom writes down, which is worth less than never having handed the
# money over — `free-trial` is that answer, and a column of its own here would
# give the weaker of the two the louder voice.
- id: moneyBack
  label: Money back
  group: Pricing
  values:
    - { id: none, label: 'No refund window' }
    - { id: a-week, label: Within a week }
    - { id: a-month, label: Within a month }
    - { id: two-months, label: Within two months }
    - { id: longer, label: Longer than two months }

# Renewal ÷ introductory: 3.3 means a €2.99 offer that renews at €9.99.
- id: renewalMultiple
  label: Renewal multiple
  group: Pricing
  render: multiple

- id: freeTier
  label: Free tier
  group: Pricing
  values:
    - { id: permanent, label: Permanent }
    - { id: trial, label: Trial only }
    - { id: none, label: None }

- id: contractMinimum
  label: Minimum contract
  group: Pricing
  values:
    - { id: none, label: None }
    - { id: monthly, label: Monthly }
    - { id: annual, label: Annual }
    - { id: multi-year, label: Multi-year }

# How the money can actually be handed over, which settles whether a provider is
# usable at all before anything else about it matters: a company that takes only
# a card is closed to a buyer whose finance department pays by transfer, and one
# that takes cryptocurrency is the only option for somebody who holds no card.
#
# Read off the checkout or the billing page. A logo strip on a pricing page is a
# claim about what the payment processor supports, not about what this provider
# accepts.
- id: paymentMethods
  label: Payment
  group: Pricing
  facet: payments
  subject: 'take{|s} {lower}'
  filterOrder: 20
  multiple: true
  values:
    - { id: card, label: Card, subject: 'take{|s} card payments' }
    - { id: paypal, label: PayPal, subject: 'take{|s} PayPal' }
    - { id: bank-transfer, label: Bank transfer, subject: 'take{|s} a bank transfer' }
    - { id: direct-debit, label: Direct debit }
    - { id: crypto, label: Crypto, subject: 'take{|s} cryptocurrency' }

# Derived, and the reason the free tier no longer has a facet to itself. A free
# tier is the most advertised thing about a price and among the least useful:
# what a reader is choosing between is how the money leaves — before the month
# or after it, metered or fixed, with a floor or without.
#
# Every value reads one of the fields above, so nothing is recorded twice and the
# record page keeps the precise answer. "None" appears nowhere here: it is the
# absence of a feature, and it stays on the record where it can be read.
- id: pricingFeatures
  label: Pricing features
  facet: pricing
  subject: 'price{|s} with {lower}'
  filterOrder: 13
  multiple: true
  values:
    - {
        id: free-tier,
        label: Free tier,
        from: freeTier,
        when: [permanent],
        subject: 'offer{|s} a permanent free tier',
        titleWith: 'with a free tier',
      }
    - {
        id: free-trial,
        label: Free trial,
        from: freeTier,
        when: [trial],
        subject: 'offer{|s} a free trial rather than a free tier',
        titleWith: 'with a free trial',
      }
    - {
        id: in-arrears,
        label: Paid in arrears,
        short: In arrears,
        from: billingTiming,
        when: [arrears],
        subject: 'bill{|s} in arrears, for usage already run up',
        titleWith: 'billed in arrears',
      }
    - {
        id: upfront,
        label: Paid before the period,
        short: Upfront,
        from: billingTiming,
        when: [advance],
        subject: 'take{|s} the money before the month it pays for',
        titleWith: 'paid before the period',
      }
    - {
        id: usage-based,
        label: Metered usage,
        short: Metered,
        from: pricingModel,
        when: [usage-based],
        subject: 'meter{|s} usage rather than sell a plan',
        titleWith: 'billed by metered usage',
      }
    # Not the opposite of `upfront`, which is why both can be true at once: that
    # one answers when the money leaves, this one answers how it is held. A
    # balance topped up in advance and drawn down is a different commitment from
    # an invoice every month, and the providers that work this way take no card.
    - {
        id: prepaid,
        label: Paid from a credit balance,
        short: Prepaid,
        from: pricingModel,
        when: [credit],
        subject: 'run{|s} on prepaid credit',
      }
    # The term, not the notice. How long the door takes to close is `exit`, and a
    # provider can hold nobody to a term while still wanting thirty days.
    - {
        id: no-minimum,
        label: No minimum term,
        short: No minimum,
        from: contractMinimum,
        when: [none],
        subject: 'hold{|s} nobody to a minimum term',
      }
    # One yes-or-no rather than the window itself, which stays on the record. A
    # provider that publishes a window has promised to undo a payment; the
    # promise above it, `free-trial`, is that the payment never happens.
    - {
        id: money-back,
        label: Money-back window,
        short: Money back,
        from: moneyBack,
        when: [a-week, a-month, two-months, longer],
        subject: 'publish{|es} a money-back window',
      }
    # Money, which is why it sits here rather than under `features`: what an SLA
    # pays when it is missed is a credit against the invoice. The flag says a
    # figure is in the contract, not that the figure is generous or that missing
    # it costs the provider anything.
    - {
        id: sla,
        label: Published SLA,
        short: SLA,
        from: sla,
        when: ['true'],
        subject: 'publish{|es} a service level agreement',
      }

