# The field dictionary. One entry per field a record may carry, and the only
# place any of it is written down: the zod schema builds its enums from these
# vocabularies, the record page builds its rows from `group` and `label`, and the
# filter panel builds itself from the entries that carry `facet`.
#
# - `id`     the frontmatter field name.
# - `label`  what a reader is shown, on the record page and as a filter heading.
# - `group`  which section of the record page the field appears in. Absent means
#            the field is validated but never rendered as a row.
# - `facet`  the URL segment where the field is filterable — /software/kirby/.
#            Absent means the field is shown but not filtered.
# - `values` the vocabulary. Absent means free text, a number or a date. A value
#            may carry `short:` — the filter panel is a narrow column and takes
#            that; everywhere the value is read as prose takes the full label.
# - `valuesFrom` borrows another field's vocabulary rather than repeating it.
# - `render` how a value is drawn where it is not a label lookup.
#
# Group order, and field order within a group, is the order of this file. The
# filter panel reads in `filterOrder`, which is a separate question: a record is
# read from the top down, filters are offered most-asked first.
#
# `facet`, `label` and the page's H1 say the same word. Number follows what the
# segment names rather than how many values a record may hold: a segment naming a
# countable kind takes the plural, because the page lists them — /categories/,
# /regions/, /runtimes/, /use-cases/, /currencies/. A segment naming the
# dimension itself stays singular however multiple the field is, because
# "deployments" and "supports" would name something else — /deployment/,
# /support/, /pricing/, /ownership/, /shell/, /metal/, /exit/.
#
# A label holding a comma must be quoted. Unquoted, the comma ends the value and
# the rest becomes a key of its own — which is how two price bands shipped as
# "$500 to $1" and "Over $1".

# ---------------------------------------------------------------- Identity

- id: founded
  label: Founded
  group: Identity

- id: ownership
  label: Ownership
  group: Identity
  facet: ownership
  filterOrder: 18
  values:
    - { id: independent, label: Independent }
    - { id: vc-backed, label: VC-backed }
    - { id: pe-owned, label: Private-equity owned }
    - { id: public, label: Publicly listed }
    - { id: subsidiary, label: Subsidiary }

- id: parent
  label: Parent
  group: Identity

# The sentence a non-active status earns is elsewhere on the record page; this
# row is the fact behind it.
- id: status
  label: Status
  group: Identity
  values:
    - { id: active, label: Active }
    - { id: acquired, label: 'Acquired, still operating' }
    - { id: renamed, label: Renamed }
    - { id: winding-down, label: Winding down }
    # `aside` keeps a record out of the register by default and offers it back
    # as a filter of its own, one group per value. Unlike `hidden` the page is
    # indexed: what happened to a host people used is worth finding, and so is
    # why a name people know is not in the list.
    - { id: discontinued, label: Discontinued, short: Defunct, aside: defunct }
    - { id: unverifiable, label: Unverifiable }
    - { id: delisted-on-request, label: Delisted on request }
    # A company that owns hosting brands without selling hosting under its own
    # name. It has no runtimes, no regions and no price, so it cannot be
    # described by the fields here — but somebody looking for United Internet
    # should find out that Ionos is the part that sells hosting.
    - { id: unlisted, label: 'Owns hosting brands, sells none', short: Unlisted, aside: unlisted }
    # `hidden` keeps a record out of the register and out of every count. It is
    # the only place that fact is written down.
    - { id: draft, label: Stub, hidden: true }
    - { id: out-of-scope, label: Out of scope, hidden: true }

