# How code gets there, and nothing else. What may be done once it has arrived is
# `sshAccess`; whether the platform can be driven by something other than a
# browser is `automation`, where the CLI and the API live because creating an app
# and reading a log are the same capability as triggering a deploy.
#
# Git is one value. A remote the provider hands over and a repository it watches
# on GitHub are different workflows, but not different answers to the question
# being asked — which is whether deploying means pushing a commit. Most providers
# offering either offer both, and we had filed our own record under one of them
# while shipping the other. SFTP and FTP are one value for the same reason.
- id: deployMethods
  label: Deployment
  group: Deployment
  facet: deployment
  filterOrder: 7
  multiple: true
