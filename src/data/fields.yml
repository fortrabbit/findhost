# How code gets there, and nothing else. What may be done once it has arrived is
# `sshAccess`; whether the platform can be driven by something other than a
# browser is `automation`, where the CLI and the API live because creating an app
# and reading a log are the same capability as triggering a deploy.
#
# Git is one value. A remote the provider hands over and a repository it watches
# on GitHub are different workflows, but not different answers to the question
# being asked — which is whether deploying means pushing a commit. Most providers
# offering either offer both, and we had filed our own record under one of them
# while shipping the other. SFTP and FTP are one value for the same reason.
- id: deployMethods
  label: Deployment
  group: Deployment
  facet: deployment
  subject: 'deploy{|s} by {lower}'
  filterOrder: 8
  multiple: true
  #
  # One question, asked four ways: what does the customer hand over, and what
  # does the platform do with it? A commit that gets built, an image that gets
  # run, a form that gets submitted, files that get copied.
  #
  # The test matters most for the container value, because a container is two
  # different things in this market and only one of them is a deployment. Where
  # the image is the deliverable — pushed to a registry, run as it arrives, the
  # platform never sees the source — that is a handover and it belongs here.
  # Where the container is the environment the platform gives you, and code
  # still arrives by git or SSH, it is not: that is what `caas` says as a
  # category and what `whoManagesOs` says about who patches it.
  #
  # A Dockerfile in a git repository that the platform builds is `git`, not this.
  # Both together is common and not a contradiction: Clever Cloud, Render, Koyeb
  # and others accept a commit to build or an image to run, and a reader
  # choosing between the two wants to know that both doors are open.
  values:
    - { id: git, label: Git, subject: 'deploy{|s} from a git commit' }
    - { id: docker-image, label: Container image, short: Container, subject: 'deploy{|s} a container image' }
    - { id: control-panel, label: Control panel, short: Panel, subject: 'deploy{|s} from a control panel' }
    - { id: file-transfer, label: File transfer, short: Upload, subject: 'accept{|s} an upload over SFTP or FTP' }

# One scale, and the two ends of it are different kinds of shell rather than
# different amounts of one. A jailed shell is complete inside its container and
# has no root behind it; root is the machine itself. "Full" was the old middle
# value and it was a judgement — full compared to what?
#
# `none` is a checked fact and belongs on the record, but not in the panel:
# nobody filters a register looking for hosts they cannot get into.
- id: sshAccess
  label: Shell
  group: Tech stack
  facet: shell
  subject: 'give{|s} {lower}'
  ordered: true
  filterOrder: 15
  values:
    - { id: none, label: None, noFilter: true }
    - {
        id: jailed,
        label: Jailed shell,
        short: Jailed,
        subject: 'give{|s} a shell inside the environment, without root',
        titleWith: 'with a jailed shell',
      }
    - {
        id: root,
        label: Root shell,
        short: Root,
        subject: 'give{|s} root on the machine',
        titleWith: 'with root access',
      }

