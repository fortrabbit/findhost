# The field dictionary. One entry per field a record may carry, and the only
# place any of it is written down: the zod schema builds its enums from these
# vocabularies, the record page builds its rows from `group` and `label`, and the
# filter panel builds itself from the entries that carry `facet`.
#
# - `id`     the frontmatter field name.
# - `label`  what a reader is shown, on the record page and as a filter heading.
# - `group`  which section of the record page the field appears in. Absent means
#            the field is validated but never rendered as a row.
# - `facet`  the URL segment where the field is filterable — /software/kirby/.
#            Absent means the field is shown but not filtered.
# - `values` the vocabulary. Absent means free text, a number or a date. A value
#            may carry `short:` — the filter panel is a narrow column and takes
#            that; everywhere the value is read as prose takes the full label.
# - `valuesFrom` borrows another field's vocabulary rather than repeating it.
# - `render` how a value is drawn where it is not a label lookup.
# - `pairs`  the other facets this one combines with as a page of its own —
#            /runtimes/php/regions/germany/. Declared on one side only, and the
#            side that declares it comes first in the path. See lib/pairs.ts for
#            what a pairing has to earn before it generates anything.
# - `titleWith` how a pair page names the second value: "PHP hosting *in
#            Germany*". On the field, or on a single value that needs its own
#            wording. A pairing whose second facet has neither cannot ship.
#
# Group order, and field order within a group, is the order of this file. The
# filter panel reads in `filterOrder`, which is a separate question: a record is
# read from the top down, filters are offered most-asked first.
#
# `facet`, `label` and the page's H1 say the same word. Number follows what the
# segment names rather than how many values a record may hold: a segment naming a
# countable kind takes the plural, because the page lists them — /categories/,
# /regions/, /runtimes/, /use-cases/, /currencies/. A segment naming the
# dimension itself stays singular however multiple the field is, because
# "deployments" and "supports" would name something else — /deployment/,
# /support/, /pricing/, /ownership/, /shell/, /metal/, /exit/.
#
# A label holding a comma must be quoted. Unquoted, the comma ends the value and
# the rest becomes a key of its own — which is how two price bands shipped as
# "$500 to $1" and "Over $1".

# ---------------------------------------------------------------- Identity

- id: founded
  label: Founded
  group: Identity

# How many people are behind it, in bands, from what the company says about
# itself — an about page, an imprint, a team page. Bands rather than a number
# because the number is never current and a range is what anybody actually wants
# to know: three people or three thousand. Six people means support from whoever
# wrote the platform, and no company at all if two of them leave; six hundred
# means a rota, an escalation path, and a reply from someone who has never seen
# the code.
#
# Recorded, never scored. It is context for the other fields rather than a merit
# of its own: a big provider is not thereby a good one and a small one is not
# thereby honest, and the Signal deliberately ignores this field.
#
# Shown and deliberately not filtered. Three records of two hundred answer it,
# so the panel offered two checkboxes above the words "195 unknown" — a filter
# that hides almost the whole register whichever box is ticked. The field earns
# its place on a record; it does not earn a column.
- id: headcount
  label: Headcount
  group: Identity
  values:
    - { id: solo, label: One person, short: Solo, subject: '{are|is} one person' }
    - { id: '2-10', label: 2 to 10, subject: 'employ{|s} between 2 and 10 people' }
    - { id: '11-50', label: 11 to 50, subject: 'employ{|s} between 11 and 50 people' }
    - { id: '51-250', label: 51 to 250, subject: 'employ{|s} between 51 and 250 people' }
    - { id: '250-plus', label: More than 250, short: '250+', subject: 'employ{|s} more than 250 people' }

# How many distinct networks link to the provider's own domain, from the
# Majestic Million — a third party's published measurement with a date on it,
# not a judgement of ours. Referring subnets rather than the rank Majestic
# derives from them: a count is a fact about the world, while a rank moves when
# domains with nothing to do with hosting shuffle past each other.
#
# It measures how linked-to a domain is. It does not measure how large the
# company is, and the two come apart hardest at the ends that matter here — a
# one-person host with a widely read blog outranks a large one that never
# writes. Recorded, never scored, and the register's order does not know it
# exists.
#
# `before` is the previous figure from the same file, so movement costs no
# history of our own. `null` means Majestic cannot measure this domain at all:
# the list is domain-level, so a provider living at a subdomain of a much larger
# company is unmeasurable rather than small. Absent means nobody pulled it.
- id: referringSubnets
  label: Reach
  group: Identity
  render: reach

# The one editorial mark on a record: we like it. No score, no weight, no
# arithmetic — a boolean somebody set on purpose, shown as a heart in the list
# and explained on the about page.
#
# It replaced a scoring system. That system computed a number from recorded
# fields, then let a person move it by hand, and after eighteen hand adjustments
# the arithmetic was decoration. A boolean says the same thing without the
# machinery that implied more precision than anybody had.
#
# It carries a `group` so it shows as a row rather than only as a heart. The
# `features` facet derives a value from it, and anything a derived facet reads
# has to be findable on the record — a reader who filters on it must be able to
# see why the record came back.
- id: favorite
  label: Favorite
  group: Identity
  render: yes-no

# Why we like it, in one sentence, on the record page beside the same heart the
# list carries. Optional: a heart with no sentence is still a heart, and a
# sentence is better than a number was.
- id: favoriteNote
  label: Favorite note

- id: ownership
  label: Ownership
  group: Identity
  facet: ownership
  subject: '{are|is} {lower}'
  filterOrder: 19
  values:
    - { id: independent, label: Independent }
    - { id: vc-backed, label: VC-backed }
    - { id: pe-owned, label: Private-equity owned }
    - { id: public, label: Publicly listed }
    - { id: subsidiary, label: Subsidiary }

# Who owns it, as a reference to that owner's own record rather than as a name
# typed twice. A parent that sells no hosting under its own name is `unlisted`
# and still has a page, which is what makes the reverse list — the brands a group
# owns — a thing the dataset can draw rather than a paragraph somebody wrote.
- id: parent
  label: Parent
  group: Identity
  relation: true

# The sentence a non-active status earns is elsewhere on the record page; this
# row is the fact behind it.
- id: status
  label: Status
  group: Identity
  values:
    - { id: active, label: Active }
    - { id: acquired, label: 'Acquired, still operating' }
    - { id: renamed, label: Renamed }
    - { id: winding-down, label: Winding down }
    # `aside` keeps a record out of the register by default and offers it back
    # as a filter of its own, one group per value. Unlike `hidden` the page is
    # indexed: what happened to a host people used is worth finding, and so is
    # why a name people know is not in the list.
    - { id: discontinued, label: Discontinued, short: Defunct, aside: defunct }
    # Beside the register with `discontinued`, because the reader's question is
    # the same one — this name is not an option any more — even though the two
    # facts differ: one stopped trading, the other can no longer be read.
    - { id: unverifiable, label: Unverifiable, aside: defunct }
    - { id: delisted-on-request, label: Delisted on request }
    # A company that owns hosting brands without selling hosting under its own
    # name. It has no runtimes, no regions and no price, so it cannot be
    # described by the fields here — but somebody looking for United Internet
    # should find out that Ionos is the part that sells hosting.
    - { id: unlisted, label: 'Owns hosting brands, sells none', short: Unlisted, aside: unlisted }
    # `hidden` keeps a record out of the register and out of every count. It is
    # the only place that fact is written down.
    - { id: draft, label: Stub, hidden: true }
    - { id: out-of-scope, label: Out of scope, hidden: true }

# ---------------------------------------------------------- Classification

# More than one can be true, and usually is: a provider selling droplets, an app
# platform and functions is all three, and picking one meant picking for it.
- id: category
  label: Categories
  group: Classification
  facet: categories
  subject: '{are|is} {lower}'
  filterOrder: 2
  multiple: true
  # Where it sells, what it costs to leave, and who holds the root password:
  # the questions asked about a kind of hosting rather than about a company.
  pairs:
    - with: regions
    - with: entry-price
    - { with: pricing, draft: true }
    - { with: operating-system, draft: true }
    - { with: software, draft: true }
    - { with: shell, draft: true }
    - { with: exit, draft: true }
  values:
    - { id: paas, label: Platform as a Service, short: PaaS }
    - { id: vps, label: Virtual Private Servers, short: VPS, title: VPS hosting }
    - { id: bare-metal, label: Bare metal }
    - { id: iaas, label: Infrastructure as a Service, short: IaaS }
    - { id: shared-hosting, label: Shared hosting }
    - { id: serverless, label: Serverless }
    - { id: static, label: Static hosting }
    - { id: caas, label: Containers as a Service, short: CaaS }
    - { id: server-management, label: Server management }
    - { id: vanity-hosting, label: Vanity hosting }
    # A market rather than an architecture, like `vanity-hosting` above it, and
    # the reason it is a category and not a price: the test is whether an account
    # that never pays is the thing being sold. A paid tier beside it does not
    # settle the question — a supporter plan that raises an allowance, or a
    # separate paid ladder, still leaves the free account a product rather than a
    # sample of one.
    #
    # `pricing: free-tier` is the other question and keeps its own answer. Most
    # records offering a permanent free tier are a PaaS, a serverless platform or
    # a panel giving away a slice of something paid, and one value cannot mean
    # both without the larger reading burying the smaller one.
    - {
        id: free-hosting,
        label: Free hosting,
        subject: 'give{|s} the hosting away as the product rather than as a sample',
      }
    - { id: lcnc, label: Low-code and no-code, short: Low-code }
    # The four below are the other invoices. Nothing of a customer's is deployed
    # or run on any of them, which is why they are a category here rather than
    # excluded: a site needs a domain, usually mail, often a database, and the
    # question "who else do I have to pay" is one this register can answer.
    #
    # `server-management` set the precedent — a category of things that are not
    # hosts, whose records answer the hosting-shaped fields with `null`, meaning
    # the question does not apply rather than nobody checked.
    #
    # A company doing both carries both: a registrar that also sells shared
    # hosting is `[shared-hosting, domains-dns]`, which is why these are values
    # of a multiple field and not a collection of their own.
    #
    # These say who sells the thing as a business. Whether it arrives *with* the
    # hosting is a different question and a different field — `features` reads
    # `domainRegistration` and the rest for that, and only counts `included`.
    # A host throwing in a free domain is not thereby in the domain business,
    # and a registrar is not thereby giving one away.
    #
    # Names and DNS are one category because they are one purchase: every
    # registrar runs nameservers, and the operators who sell DNS on its own sell
    # registration beside it. Splitting them would make two lists of the same
    # companies.
    - { id: domains-dns, label: Domains and DNS, short: Domains, subject: 'sell{|s} domain names or run{|s} DNS' }
    - { id: mail, label: Business email, subject: 'run{|s} mailboxes on a domain' }
    - { id: dbaas, label: Database as a Service, short: DBaaS, subject: 'sell{|s} a managed database as the product' }
    - { id: git-hosting, label: Git hosting, subject: 'host{|s} git repositories' }

# Two answers, because there are two: somebody applies the security updates or
# somebody else does. A panel automates that work without moving it, and an image
# is still yours to rebuild — both are "you" with a tool, which is a fact about
# the tooling rather than about who is responsible.
- id: whoManagesOs
  label: Operating system
  group: Classification
  facet: operating-system
  subject: 'answer{|s} "{lower}" to who manages the operating system'
  filterOrder: 16
