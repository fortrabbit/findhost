    # two have Ansible.
    - {
        id: iac,
        label: Infrastructure as code,
        short: IaC,
        from: iacSupport,
        when: [terraform, cloudformation, ansible],
        titleWith: 'with infrastructure as code',
      }

- id: iacSupport
