# Whether the provider puts an uptime figure in a contract. Recorded as a yes or
# a no rather than as the percentage, because the percentage is not a fact about
# a provider: almost every host that publishes one publishes several, one per
# product. Scaleway alone runs from 99% on shared instances through 99.5% on
# dedicated to no commitment at all on development ones, and IONOS spans 99.5% to
# 99.995% across its cloud. A single band would have to pick one of those and be
# wrong about the rest.
#
# The flag says the figure is in a contract and nothing beyond it. What is owed
# when the figure is missed runs from a schedule of credits to no remedy named at
# all, so it cannot be assumed from the yes. A percentage on a marketing page is
# in no contract and does not count, and that is where most of the shared-hosting
# market keeps its number. Figures and remedies belong in a record's prose, where
# they can be qualified per product and cited.
- id: sla
  label: Published SLA
  group: Support
  render: yes-no

# ------------------------------------------------------------- Included

# What comes with the hosting and what has to be bought elsewhere. Recorded one
# thing at a time rather than as a list, because a list can only say what is
# included: absent would mean both "they do not offer it" and "nobody checked",
# and the whole point of the question is the difference.
#
# Three answers rather than two. "They sell it, on its own line" is the ordinary
# case for email and for domains, and a yes/no has nowhere to put it.
- id: domainRegistration
  label: Domain registration
  group: Other features
  values:
    - { id: included, label: Included }
    - { id: paid-addon, label: Paid add-on }
    - { id: none, label: None }

- id: dnsHosting
  label: DNS hosting
  group: Other features
  valuesFrom: domainRegistration

- id: emailHosting
  label: Email hosting
  group: Other features
  valuesFrom: domainRegistration

- id: cdnIncluded
  label: CDN
  group: Other features
  valuesFrom: domainRegistration

# Two answers, not three: a preview URL is free wherever it exists at all, and
# nobody sells one on its own.
- id: testDomain
  label: Test domain
  group: Other features
  values:
    - { id: included, label: Included }
    - { id: none, label: None }

# Whether more than one person can work on the same hosting, and how far that
# goes. A platform where the account is the login is a different product from one
# where a team, or a client, has a place of their own — and it is invisible on
# every pricing page until somebody needs it.
- id: collaboration
  label: Collaboration
  group: Other features
  values:
    - { id: none, label: 'One account, one login' }
    - { id: team, label: 'Team members' }
    - { id: clients, label: 'Team members and client access' }

# A place to try the deploy before it is the site. Recorded like the rest of this
# group, because for a good many providers it is what the next tier up is for.
- id: staging
  label: Staging
  group: Other features
  valuesFrom: domainRegistration

# Derived, like `automation`: the fields above hold the detail and this asks the
# one thing a filter is for — does it come with the hosting. A paid add-on is
# still something to go and buy, which is the errand the reader is trying to
# avoid, so it does not count as a yes here.
- id: features
  label: Other features
  facet: features
  subject: 'include{|s} {lower}'
  filterOrder: 9
  multiple: true
  values:
    - {
        id: collaboration,
        label: Collaboration,
        from: collaboration,
        when: [team, clients],
        subject: 'let{|s} more than one person work on the same hosting',
      }
    - {
        id: staging,
        label: Staging,
        from: staging,
        when: [included],
        subject: 'give{|s} somewhere to try a deploy before it is the site',
      }
    # These four name the same things as the `domains-dns` and `mail`
    # categories, and mean something else: not who sells it, but who hands it
    # over with the hosting at no extra charge. The labels say "included" for
    # that reason — a page headed "Domains" beside a category headed "Domains
    # and DNS" read as the same list twice, and they share two records of twenty.
    - {
        id: domains,
        label: Domain included,
        short: Domains,
        from: domainRegistration,
        when: [included],
        subject: 'include{|s} a domain with the hosting',
      }
    - {
        id: dns,
        label: DNS included,
        short: DNS,
        from: dnsHosting,
        when: [included],
        subject: 'host{|s} DNS themselves, at no extra charge',
      }
    - {
        id: email,
        label: Email included,
        short: Email,
        from: emailHosting,
        when: [included],
        subject: 'host{|s} email themselves, at no extra charge',
      }
    - {
        id: cdn,
        label: CDN included,
        short: CDN,
        from: cdnIncluded,
        when: [included],
        subject: 'include{|s} a CDN with the hosting',
      }
    - {
        id: test-domain,
        label: Test domain,
        short: Test URL,
        from: testDomain,
        when: [included],
        subject: 'hand{|s} out a test URL to deploy to',
      }
    # Two sources, either of which answers: the provider's own published claim,
    # and an id in the Green Web Foundation's directory. That second is a field
    # with no vocabulary to name — an id in somebody else's database — so its
    # `when` is `*`, meaning recorded at all.
    - id: green
      label: Green energy
      subject: 'say{|s} they run on green energy, and publish something to back it'
      sources:
        - { from: greenWebId, when: ['*'] }
        - { from: energyClaim, when: [24-7-cfe, annual-matched, offset, grid-mix-disclosed] }
    # The odd one out, and here rather than in a box of its own because a filter
    # panel with a single checkbox in it reads as a mistake. Every other value in
    # this field is a fact about the provider; this one is a mark we made.
    - {
        id: favorite,
        label: Favorite,
        from: favorite,
        when: ['true'],
        subject: 'we like, for a reason each record gives',
      }

