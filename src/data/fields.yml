    - { id: unclear, label: Unclear }

# ----------------------------------------------------------- Environment

# What a provider publishes, never a judgement of it. Offsets, annual matching
# and 24/7 carbon-free are three different claims marketing blurs into one.
- id: energyClaim
  label: Energy claim
  group: Environment
  values:
    - { id: 24-7-cfe, label: 24/7 carbon-free }
    - { id: annual-matched, label: Annually matched renewables }
    - { id: offset, label: Offsets purchased }
    - { id: grid-mix-disclosed, label: Grid mix published }
    - { id: none-published, label: None published }

- id: certifications
  label: Certifications
  group: Environment
  multiple: true
  values:
    - { id: iso-27001, label: ISO 27001 }
    - { id: iso-14001, label: ISO 14001 }
    - { id: iso-50001, label: ISO 50001 }
    - { id: soc-2, label: SOC 2 }
    - { id: pci-dss, label: PCI DSS }
    - { id: b-corp, label: B Corp }

# Someone else's verification, linked rather than copied.
- id: greenWebId
  label: Green Web directory
  group: Environment

# --------------------------------------------------------------- Support

# supportHours answers one question: when can you reach a human about a
# production problem, on the cheapest paid plan.
- id: supportChannels
  label: Support
  group: Support
  facet: support
  filterOrder: 6
  multiple: true
  values:
    - { id: email, label: Email }
    - { id: chat, label: Chat }
    - { id: phone, label: Phone }
    - { id: forum, label: Forum }

- id: supportHours
  label: Hours
  group: Support
  values:
    - { id: 24-7, label: Around the clock }
    - { id: business-hours, label: Business hours }
    - { id: community-only, label: Community only }

- id: supportTiering
  label: Tiering
  group: Support
  values:
    - { id: all-plans, label: Same on every plan }
    - { id: paid-upgrade, label: Better on paid plans }
    - { id: enterprise-only, label: Enterprise only }

# ------------------------------------------------------------- Included

# What comes with the hosting and what has to be bought elsewhere. Recorded one
# thing at a time rather than as a list, because a list can only say what is
# included: absent would mean both "they do not offer it" and "nobody checked",
# and the whole point of the question is the difference.
#
# Three answers rather than two. "They sell it, on its own line" is the ordinary
# case for email and for domains, and a yes/no has nowhere to put it.
- id: domainRegistration
  label: Domain registration
  group: Other features
  values:
    - { id: included, label: Included }
    - { id: paid-addon, label: Paid add-on }
    - { id: none, label: None }

- id: dnsHosting
  label: DNS hosting
  group: Other features
  valuesFrom: domainRegistration

- id: emailHosting
  label: Email hosting
  group: Other features
  valuesFrom: domainRegistration

- id: cdnIncluded
  label: CDN
  group: Other features
  valuesFrom: domainRegistration

# Two answers, not three: a preview URL is free wherever it exists at all, and
# nobody sells one on its own.
- id: testDomain
  label: Test domain
  group: Other features
  values:
    - { id: included, label: Included }
    - { id: none, label: None }

# Whether more than one person can work on the same hosting, and how far that
# goes. A platform where the account is the login is a different product from one
# where a team, or a client, has a place of their own — and it is invisible on
# every pricing page until somebody needs it.
- id: collaboration
  label: Collaboration
  group: Other features
  values:
    - { id: none, label: 'One account, one login' }
    - { id: team, label: 'Team members' }
    - { id: clients, label: 'Team members and client access' }

# A place to try the deploy before it is the site. Recorded like the rest of this
# group, because for a good many providers it is what the next tier up is for.
- id: staging
  label: Staging
  group: Other features
  valuesFrom: domainRegistration

# Derived, like `automation`: the fields above hold the detail and this asks the
# one thing a filter is for — does it come with the hosting. A paid add-on is
# still something to go and buy, which is the errand the reader is trying to
# avoid, so it does not count as a yes here.
- id: features
  label: Other features
  facet: features
  filterOrder: 8
  multiple: true
  values:
    - { id: collaboration, label: Collaboration, from: collaboration, when: [team, clients] }
    - { id: staging, label: Staging, from: staging, when: [included] }
    - { id: domains, label: Domains, from: domainRegistration, when: [included] }
    - { id: dns, label: DNS, from: dnsHosting, when: [included] }
    - { id: email, label: Email, from: emailHosting, when: [included] }
    - { id: cdn, label: CDN, from: cdnIncluded, when: [included] }
    - { id: test-domain, label: Test domain, short: Test URL, from: testDomain, when: [included] }

# ------------------------------------------------------------ Automation

- id: mcpServer
  label: MCP
  group: Automation
  values:
    - { id: official, label: Official }
    - { id: community, label: Community }
    - { id: none, label: None }

- id: cliTool
  label: CLI
  group: Automation
  values:
    - { id: official, label: Official }
    - { id: third-party, label: Third-party }
    - { id: none, label: None }

- id: apiAvailable
  label: API
  group: Automation
  values:
    - { id: public, label: Public }
    - { id: partner-only, label: Partners only }
    - { id: none, label: None }

# Derived, and the only field here that is. No record carries `automation`; each
# value reads one of the three fields above and asks the single question a filter
# is for — is there one. The detail stays on the record, where "Official" and
# "Community" mean different things; in a filter column they are the same answer.
- id: automation
  label: Automation
  facet: automation
  filterOrder: 10
  multiple: true
  values:
    - { id: api, label: API, from: apiAvailable, when: [public, partner-only] }
    - { id: cli, label: CLI, from: cliTool, when: [official, third-party] }
    - { id: mcp, label: MCP, from: mcpServer, when: [official, community] }

- id: iacSupport
  label: Infrastructure as code
  group: Automation
  multiple: true
  values:
    - { id: terraform, label: Terraform }
    - { id: cloudformation, label: CloudFormation }
    - { id: ansible, label: Ansible }

