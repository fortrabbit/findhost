# Facet definitions. Data, not code — the find island renders whatever it is
# handed, so an eleventh facet is an entry here and nothing else.
#
# `field` names the provider field a facet reads. Every value a record uses must
# appear here; scripts/validate.ts fails the build otherwise.

# Named software a provider documents support for — a one-click installer, an
# official guide, a maintained buildpack. It records what the provider says it
# supports, not how well it runs. `specialisation` is the stronger, rarer claim:
# a platform built for one thing, like Servd for Craft or Kinsta for WordPress.
- id: software
  label: Runs
  field: software
  multiple: true
  values:
    - { id: wordpress, label: WordPress }
