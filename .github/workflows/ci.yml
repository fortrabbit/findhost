name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 24 rather than 22: the unit tests are TypeScript run straight through
          # `node --test`, which needs the type stripping that ships unflagged here.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run build
      # Guards zod cannot express: unique ids, taxonomy coverage, and the
      # assertion that no rank, boost or weight field has appeared anywhere.
      - run: pnpm run validate
      # Every link we publish at ourselves, checked against what we published.
      # Renaming a route or a facet value is the edit that leaves one behind, and
      # nothing else in this file would notice.
      - run: pnpm run linkcheck:internal
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e

  # Third-party availability is not something a content pull request should be
  # blocked on, so this reports and never fails the run. It exists because a
  # dataset whose whole claim is "we read this page on this date" has to notice
  # when the page stops existing.
  links:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run linkcheck
