# The refresh routine's merge lane. It pushes everything it researched to
# claude/refresh: dates moved on a record found unchanged, changed field values,
# and a changed status. The condition is a citation — every changed field
# carries a sources entry naming it — and this merges what passes that. Nobody
# here has a routine for reading pull requests, and one sitting open is not
# review; it is a change that has not shipped while the register goes on saying
# something the provider's own pages contradict. What is left goes to
# claude/refresh-review — an uncited field, an identity field, a line of prose —
# and this workflow never touches that branch.
#
# Pushes to main from here carry the default token, so they trigger no other
# workflow: not CI, and not the IndexNow ping CI would send. That is why the
# build runs here first, so what lands on main has been built once, and why
# the ping is sent from here too.
name: Refresh

on:
  push:
    branches: [claude/refresh]

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The rule is src/lib/confirmation.ts, the same one the routine used to
      # pick this branch. A failure here means the routine put something it
      # cannot cite on the merge lane; the run goes red and a person looks.
      - run: node scripts/refresh-guard.ts origin/main HEAD
      - run: pnpm run validate
      - run: pnpm run build
      - name: Merge into main
        id: merge
        run: |
          git config user.name "FindHost refresh"
          git config user.email "noreply@findhost.app"
          git fetch origin main
          echo "before=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          git checkout main
          git merge --no-ff claude/refresh -m "Merge sourced changes from the refresh routine"
          git push origin main
          echo "after=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin --delete claude/refresh
      # The same ping CI sends on a push to main, for the pages this merge
      # changed. The sitemap it reads is the one the build above wrote, which
      # lists the same pages main will serve. Reported, never blocking.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          SITE_URL: https://www.findhost.app
        run: node scripts/indexnow.ts ${{ steps.merge.outputs.before }} ${{ steps.merge.outputs.after }}
